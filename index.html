<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidora AI - Real Video Generator</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.card{background:#1a1a1a;border-radius:20px;padding:20px;width:100%;max-width:400px;border:1px solid #333}
textarea{width:100%;height:100px;background:#222;color:white;border:1px solid #444;border-radius:12px;padding:12px;margin:15px 0}
.btn{width:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border:none;padding:15px;border-radius:12px;color:white;font-weight:bold;font-size:16px;cursor:pointer}
.preview{margin-top:20px;display:none;text-align:center}
.preview video{width:100%;border-radius:12px;margin-top:10px}
.st{margin-top:10px;color:#aaa;font-size:14px}
.tab{display:flex;gap:10px;margin-bottom:15px}
.tab div{flex:1;text-align:center;padding:10px;background:#222;border-radius:10px;cursor:pointer}
.tab div.active{background:#333;border:1px solid #8b5cf6}
</style>
</head>
<body>
<div class="card">
<div style="text-align:center;font-size:20px;font-weight:bold;margin-bottom:15px">✨ Vidora AI</div>
<div class="tab">
<div id="tab0" class="active" onclick="setMode(0)">Image → Video</div>
<div id="tab1" onclick="setMode(1)">Text → Video</div>
</div>
<div id="imgSection">
<input type="file" id="imgInput" accept="image/*" onchange="loadImg(event)" style="width:100%;padding:10px;background:#222;border-radius:10px;border:1px dashed #555">
</div>
<textarea id="prompt" placeholder="e.g. A futuristic city at night with flying cars, cinematic, 4K..."></textarea>
<button class="btn" id="genBtn" onclick="gen()">✨ Generate Video →</button>
<div class="preview" id="preview">
<img id="pImg" style="width:100%;border-radius:12px;display:none">
<div class="st" id="pSt"></div>
<video id="pVideo" controls style="display:none"></video>
</div>
<div style="text-align:center;margin-top:15px;font-size:12px;color:#666">✨ Powered by AI • Vidora AI • Real Hugging Face Engine</div>
</div>
<script>
let imgData=null;
function setMode(m){
 document.getElementById('tab0').classList.toggle('active',m==0);
 document.getElementById('tab1').classList.toggle('active',m==1);
 const sec=document.getElementById('imgSection');
 if(m==1){sec.style.opacity='0.3';sec.style.pointerEvents='none';}
 else {sec.style.opacity='1';sec.style.pointerEvents='auto';}
}
function loadImg(e){
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=()=>{
   imgData=r.result;
   document.getElementById('pImg').src=imgData;
   document.getElementById('pImg').style.display='block';
   document.getElementById('preview').style.display='block';
   document.getElementById('pSt').innerText='✅ Image loaded';
 };
 r.readAsDataURL(f);
}
async function gen(){
 const p=document.getElementById('prompt').value.trim();
 if(!p){alert('Please write your video idea!');return;}
 const btn=document.getElementById('genBtn');
 const st=document.getElementById('pSt');
 const preview=document.getElementById('preview');
 const video=document.getElementById('pVideo');
 
 preview.style.display='block';
 btn.innerText='⏳ Generating... Please wait 30-60s';
 btn.disabled=true;
 st.innerHTML='⏳ Calling Real AI Engine...<br><small>This may take 30-60 seconds, first time longer</small>';
 video.style.display='none';
 
 try{
   const res=await fetch('/api/generate',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({prompt:p})
   });
   if(!res.ok){
     const err=await res.json();
     throw new Error(err.error||'Failed');
   }
   const blob=await res.blob();
   const url=URL.createObjectURL(blob);
   video.src=url;
   video.style.display='block';
   st.innerHTML='🔥 Video Generated Successfully! ✅';
   btn.innerText='✨ Generate Video →';
   btn.disabled=false;
 }catch(e){
   st.innerHTML='❌ Error: '+e.message+'<br><small>Check Vercel logs, maybe model is loading, try again in 30s</small>';
   btn.innerText='✨ Generate Video →';
   btn.disabled=false;
 }
}
</script>
</body>
</html>
