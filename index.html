<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidora AI - Video Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh}
header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:800;background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:#fff;color:#000;padding:12px 24px;border-radius:999px;font-weight:600;border:none;cursor:pointer}
.hero{text-align:center;padding:80px 20px}
.hero h1{font-size:54px;line-height:1.1;margin-bottom:20px}
.hero h1 span{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#888;font-size:18px;margin-bottom:30px}
.box{max-width:700px;margin:40px auto;background:#151515;border:1px solid #222;border-radius:24px;padding:24px}
.box textarea{width:100%;background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:16px;color:#fff;height:120px;resize:none;font-size:16px}
.box-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.generate{background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;padding:14px 32px;border-radius:999px;border:none;font-weight:700;cursor:pointer}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px;max-width:1200px;margin:auto}
.card{background:#151515;border-radius:20px;overflow:hidden;border:1px solid #222}
.card div{height:160px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;font-size:40px}
.card p{padding:14px;color:#aaa}
</style>
</head>
<body>
<header>
<div class="logo">VIDORA AI</div>
<button class="btn">Get Started</button>
</header>
<div class="hero">
<h1>Create amazing<br><span>videos with AI</span></h1>
<p>Turn your ideas into stunning videos in seconds. No editing skills needed.</p>
<div class="box">
<textarea placeholder="Describe your video idea... e.g. A futuristic city at night with flying cars"></textarea>
<div class="box-footer">
<span style="color:#666">✨ Powered by AI</span>
<button class="generate" onclick="alert('Vidora AI is ready! Connect your API next')">Generate Video →</button>
</div>
</div>
</div>
<div class="videos">
<div class="card"><div>🎬</div><p>Anime style city - 2.3k likes</p></div>
<div class="card"><div>🚀</div><p>Space adventure - 1.8k likes</p></div>
<div class="card"><div>🌊</div><p>Ocean waves - 3.1k likes</p></div>
</div>
</body>
</html>
